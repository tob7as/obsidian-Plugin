<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Capri, the plugin's built-in holographic guide: an angular figure in crimson, black and neon green on a neon city background">
  <defs>
    <radialGradient id="bg" cx="50%" cy="60%" r="75%">
      <stop offset="0%" stop-color="#2a0d14"/>
      <stop offset="100%" stop-color="#12070a"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0 L0 0 0 24" fill="none" stroke="#4ff0e0" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#4ff0e0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#4ff0e0" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="640" height="360" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#grid)"/>

  <!-- skyline -->
  <g fill="#12070a" stroke="#ff4a4a" stroke-opacity="0.45">
    <rect x="300" y="170" width="34" height="190"/>
    <rect x="342" y="120" width="40" height="240"/>
    <rect x="392" y="200" width="28" height="160"/>
    <rect x="430" y="90" width="46" height="270"/>
    <rect x="486" y="150" width="30" height="210"/>
    <rect x="526" y="190" width="40" height="170"/>
    <rect x="576" y="130" width="38" height="230"/>
  </g>
  <g fill="#4ff0e0" fill-opacity="0.18" stroke="#4ff0e0" stroke-opacity="0.8">
    <rect x="436" y="96" width="34" height="264"/>
    <rect x="348" y="126" width="28" height="234"/>
  </g>
  <rect x="452" y="0" width="2" height="96" fill="url(#beam)"/>

  <!-- platform ring under Capri -->
  <ellipse cx="140" cy="318" rx="70" ry="14" fill="none" stroke="#4ff0e0" stroke-width="2" filter="url(#glow)"/>

  <!-- Capri: the plugin's built-in figure (same shapes the plugin draws), a hooded netrunner -->
  <g transform="translate(66 6) scale(0.98)" filter="url(#glow)">
    <polygon points="64,96 86,96 92,114 58,114" fill="#2a1440"/>
    <polygon points="52,112 98,112 108,200 100,250 50,250 42,200" fill="#2a1440" stroke="#ff4fa8" stroke-opacity="0.5"/>
    <polygon points="71,114 79,114 83,244 67,244" fill="#ff4fa8"/>
    <polygon points="52,116 38,160 34,206 44,208 50,166 60,134" fill="#1b0b14"/>
    <polygon points="98,116 112,160 116,206 106,208 100,166 90,134" fill="#1b0b14"/>
    <polygon points="32,206 46,206 44,216 34,216" fill="#4ff0e0"/>
    <polygon points="104,206 118,206 116,216 106,216" fill="#4ff0e0"/>
    <polygon points="58,250 72,250 71,304 58,304" fill="#1b0b14"/>
    <polygon points="78,250 92,250 92,304 79,304" fill="#1b0b14"/>
    <polygon points="56,300 72,300 72,310 54,310" fill="#4ff0e0"/>
    <polygon points="78,300 94,300 96,310 78,310" fill="#4ff0e0"/>
    <polygon points="50,245 100,245 100,251 50,251" fill="#4ff0e0"/>
    <polygon points="48,42 75,16 102,42 106,80 94,98 56,98 44,80" fill="#1b0b14" stroke="#ff4fa8" stroke-opacity="0.6"/>
    <polygon points="48,42 75,16 102,42 98,48 75,26 52,48" fill="#ff4fa8"/>
    <polygon points="58,58 92,58 90,70 60,70" fill="#4ff0e0"/>
  </g>

  <!-- title card -->
  <g font-family="Rajdhani, Bahnschrift, 'Segoe UI', sans-serif" font-weight="700">
    <rect x="236" y="34" width="190" height="30" fill="#1f6f6a"/>
    <text x="331" y="55" fill="#ffffff" font-size="17" letter-spacing="3" text-anchor="middle">CAPRI//NEON</text>
    <text x="236" y="98" fill="#4ff0e0" font-size="38" letter-spacing="2">CAPRI</text>
    <text x="236" y="124" fill="#ff6b5e" font-size="15" letter-spacing="2">YOUR HOLOGRAPHIC CITY GUIDE</text>
    <text x="236" y="150" fill="#f0d84a" font-size="13" letter-spacing="1" font-family="'Share Tech Mono', Consolas, monospace" font-weight="400">› Heyyy, choom! Where to?</text>
  </g>
  <rect x="0" y="352" width="640" height="2" fill="#ff4a4a"/>
</svg>
